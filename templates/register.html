<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create account - ShardGate</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --line:#2d333b; --text:#e6edf3; --muted:#8b949e; --accent:#58a6ff; --warn:#f85149; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--text); display:flex; min-height:100vh; flex-direction:column; }
  header { padding:16px 28px; border-bottom:1px solid var(--line); }
  header a { color:var(--text); text-decoration:none; font-size:20px; font-weight:600; letter-spacing:.5px; }
  main { flex:1; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:28px; width:360px; max-width:100%; }
  h2 { margin:0 0 6px; font-size:18px; }
  .muted { color:var(--muted); font-size:13px; margin:0 0 16px; }
  label { display:block; font-size:12px; color:var(--muted); margin:12px 0 4px; text-transform:uppercase; letter-spacing:.6px; }
  input { width:100%; background:#0d1117; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:10px; font:inherit; }
  button { width:100%; margin-top:18px; background:var(--accent); border:none; color:#0d1117; font-weight:600; padding:10px; border-radius:8px; cursor:pointer; font-size:14px; }
  button:hover { filter:brightness(1.1); }
  #err { color:var(--warn); font-size:13px; margin-top:12px; min-height:16px; }
  .alt { text-align:center; margin-top:14px; font-size:13px; }
  .alt a { color:var(--accent); text-decoration:none; }
  footer { border-top:1px solid var(--line); padding:16px 28px; display:flex; gap:16px; font-size:13px; color:var(--muted); }
  footer a { color:var(--muted); text-decoration:none; }
  footer .credit { margin-left:auto; }
</style>
</head>
<body>
<header><a href="/">ShardGate</a></header>
<main>
  <div class="card">
    <h2>Create account</h2>
    <p class="muted">A private vault is created for you: AES-256-GCM documents with a 2-of-3 Shamir-split master key, plus two demo documents to try.</p>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email">
    <label for="password">Password (8+ characters)</label>
    <input id="password" type="password" autocomplete="new-password">
    <button onclick="go()">Create account</button>
    <div id="err"></div>
    <div class="alt">Already registered? <a href="/login">Sign in</a></div>
  </div>
</main>
<footer>
  <a href="/privacy.html">Privacy policy</a>
  <a href="/about.html">About</a>
  <span class="credit"><a href="https://shlokgit-04.github.io" rel="noopener">Made by Shlok V.</a></span>
</footer>
<script>
async function go(){
  document.getElementById('err').textContent = '';
  const r = await fetch('/api/auth/register', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({email: document.getElementById('email').value, password: document.getElementById('password').value})});
  if (r.ok){ location.href = '/'; return; }
  const j = await r.json().catch(() => ({error:'registration failed'}));
  document.getElementById('err').textContent = j.error || 'registration failed';
}
document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
</script>
</body>
</html>
